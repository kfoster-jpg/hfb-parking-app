<!DOCTYPE html>
<html>
<head>
  <title>HFB Staff Code Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="font-family: Arial, sans-serif; padding: 24px; max-width: 900px; margin: auto;">

  <div id="login-screen">
    <h1>Staff Login</h1>

    <input
      id="staff-password"
      type="password"
      placeholder="Enter staff password"
      style="width:100%; padding:12px; font-size:16px; margin:8px 0 12px;"
    />

    <button
      onclick="checkPassword()"
      style="width:100%; padding:12px; background:black; color:white; border:none;"
    >
      Login
    </button>

    <p id="login-error" style="color:red; font-weight:bold;"></p>
  </div>

  <div id="dashboard-screen" style="display:none;">
    <h1>Parking Codes</h1>

    <p id="staff-name-display" style="font-weight:bold;"></p>

    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center;">

      <select
        onchange="setFilter(this.value)"
        style="padding:10px 14px; font-size:16px;"
      >
        <option value="today-all">Today - All</option>
        <option value="today-unredeemed">Today - Unredeemed</option>
        <option value="today-redeemed">Today - Redeemed</option>
        <option value="30min">Last 30 Min</option>
        <option value="60min">Last 60 Min</option>
        <option value="recent">Recent Codes</option>
      </select>

      <button
        onclick="startScanner()"
        style="padding:10px 14px; background:black; color:white; border:none;"
      >
        Scan QR Code
      </button>

      <button
        onclick="loadCodes()"
        style="padding:10px 14px;"
      >
        Refresh
      </button>

      <button
        onclick="logoutStaff()"
        style="padding:10px 14px;"
      >
        Logout
      </button>

    </div>

    <div id="scanner" style="display:none; margin:16px 0;">
      <div id="qr-reader" style="width:100%; max-width:420px;"></div>

      <button
        onclick="stopScanner()"
        style="margin-top:10px; padding:10px 14px;"
      >
        Stop Scanner
      </button>
    </div>

    <p id="filter-label" style="font-weight:bold;"></p>

    <div id="codes">Loading codes...</div>
  </div>

  <script>
    const STAFF_USERS = {
      "password1": "Josh",
      "password2": "Crysten",
      "password3": "Manager 1",
      "password4": "Manager 2"
    };

    let currentFilter = "today-all";
    let allCodes = [];

    let html5QrCode = null;
    let scannerRunning = false;

    function checkPassword() {
      const password = document.getElementById("staff-password").value;
      const error = document.getElementById("login-error");

      if (STAFF_USERS[password]) {
        sessionStorage.setItem("hfb_staff_logged_in", "true");
        sessionStorage.setItem("hfb_staff_name", STAFF_USERS[password]);

        showDashboard();
      } else {
        error.innerText = "Incorrect password.";
      }
    }

    function showDashboard() {
      const staffName = sessionStorage.getItem("hfb_staff_name");

      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard-screen").style.display = "block";

      document.getElementById("staff-name-display").innerText =
        "Logged in as: " + staffName;

      loadCodes();
    }

    function checkExistingLogin() {
      if (
        sessionStorage.getItem("hfb_staff_logged_in") === "true" &&
        sessionStorage.getItem("hfb_staff_name")
      ) {
        showDashboard();
      }
    }

    function logoutStaff() {
      stopScanner();

      sessionStorage.removeItem("hfb_staff_logged_in");
      sessionStorage.removeItem("hfb_staff_name");

      location.reload();
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderCodes();
    }

    function isToday(dateString) {
      if (!dateString) return false;

      const codeDate = new Date(dateString);
      const today = new Date();

      return (
        codeDate.getFullYear() === today.getFullYear() &&
        codeDate.getMonth() === today.getMonth() &&
        codeDate.getDate() === today.getDate()
      );
    }

    function isWithinMinutes(dateString, minutes) {
      if (!dateString) return false;

      const now = Date.now();
      const issued = new Date(dateString).getTime();

      return now - issued <= minutes * 60 * 1000;
    }

    function getFilteredCodes() {

      if (currentFilter === "recent") {
        return allCodes;
      }

      if (currentFilter === "30min") {
        return allCodes.filter(item =>
          isWithinMinutes(item.issued_at, 30)
        );
      }

      if (currentFilter === "60min") {
        return allCodes.filter(item =>
          isWithinMinutes(item.issued_at, 60)
        );
      }

      const todaysCodes = allCodes.filter(item =>
        isToday(item.issued_at)
      );

      if (currentFilter === "today-unredeemed") {
        return todaysCodes.filter(item => !item.redeemed);
      }

      if (currentFilter === "today-redeemed") {
        return todaysCodes.filter(item => item.redeemed);
      }

      return todaysCodes;
    }

    function updateFilterLabel(filteredCodes) {
      const label = document.getElementById("filter-label");

      const labels = {
        "today-all": "Showing today’s codes",
        "today-unredeemed": "Showing today’s unredeemed codes",
        "today-redeemed": "Showing today’s redeemed codes",
        "recent": "Showing recent codes",
        "30min": "Showing last 30 minutes",
        "60min": "Showing last 60 minutes"
      };

      label.innerText =
        labels[currentFilter] + " — " + filteredCodes.length + " found";
    }

    async function loadCodes() {
      const container = document.getElementById("codes");

      container.innerHTML = "Loading codes...";

      const response = await fetch("/api/list-codes");
      const data = await response.json();

      if (!data.success) {
        container.innerHTML = "Could not load codes.";
        return;
      }

      allCodes = data.codes || [];

      renderCodes();
    }

    function renderCodes() {
      const container = document.getElementById("codes");

      const filteredCodes = getFilteredCodes();

      updateFilterLabel(filteredCodes);

      if (!filteredCodes.length) {
        container.innerHTML = "No codes found for this view.";
        return;
      }

      container.innerHTML = filteredCodes.map(item => {

        const issued =
          item.issued_at
            ? new Date(item.issued_at).toLocaleString()
            : "Unknown";

        const redeemedAt =
          item.redeemed_at
            ? new Date(item.redeemed_at).toLocaleString()
            : "";

        return `
          <div style="
            border:1px solid ${item.redeemed ? '#d1d5db' : '#facc15'};
            background:${item.redeemed ? '#f9fafb' : '#fffbeb'};
            border-radius:10px;
            padding:16px;
            margin-bottom:12px;
          ">

            <div style="
              font-size:24px;
              font-weight:bold;
              letter-spacing:1px;
            ">
              ${item.code}
            </div>

            <div style="margin-top:8px;">
              <strong>Email:</strong> ${item.email || "N/A"}<br>

              <strong>Issued:</strong> ${issued}<br>

              <strong>Status:</strong>
              ${
                item.redeemed
                  ? "✅ Redeemed" + (redeemedAt ? " at " + redeemedAt : "")
                  : "🟡 Not redeemed"
              }<br>

              <strong>Redeemed By:</strong>
              ${item.redeemed_by || "N/A"}
            </div>

            ${
              item.redeemed
                ? `
                  <button
                    onclick="updateCode('${item.code}', 'unredeem')"
                    style="
                      margin-top:12px;
                      padding:10px 14px;
                    "
                  >
                    Mark Unredeemed
                  </button>
                `
                : `
                  <button
                    onclick="updateCode('${item.code}', 'redeem')"
                    style="
                      margin-top:12px;
                      padding:10px 14px;
                      background:black;
                      color:white;
                      border:none;
                      border-radius:6px;
                    "
                  >
                    Mark Redeemed
                  </button>
                `
            }

          </div>
        `;
      }).join("");
    }

    async function updateCode(code, action) {

      const managerName =
        sessionStorage.getItem("hfb_staff_name");

      if (!managerName) {
        alert("Please log in again.");
        logoutStaff();
        return;
      }

      const label =
        action === "redeem"
          ? "redeemed"
          : "unredeemed";

      if (!confirm("Mark " + code + " as " + label + "?")) {
        return;
      }

      const response = await fetch("/api/redeem-code", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          code: code,
          manager_name: managerName,
          action: action
        })
      });

      const data = await response.json();

      alert(data.message || "Updated.");

      loadCodes();
    }

    async function startScanner() {

      const scanner = document.getElementById("scanner");

      scanner.style.display = "block";

      if (scannerRunning) return;

      html5QrCode = new Html5Qrcode("qr-reader");

      try {

        scannerRunning = true;

        await html5QrCode.start(
          { facingMode: "environment" },

          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },

          async function(decodedText) {
            await stopScanner();
            handleScannedCode(decodedText);
          },

          function(errorMessage) {
            // Ignore normal scan misses
          }
        );

      } catch (err) {

        scannerRunning = false;

        alert(
          "Camera access failed or QR scanner could not start. Please enter the code manually."
        );
      }
    }

    async function stopScanner() {

      if (html5QrCode && scannerRunning) {

        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
        } catch (err) {
          // Ignore cleanup errors
        }
      }

      html5QrCode = null;
      scannerRunning = false;

      const scanner = document.getElementById("scanner");

      if (scanner) {
        scanner.style.display = "none";
      }
    }

    function handleScannedCode(code) {

      const cleaned =
        code.replace("HFB-", "")
          .trim()
          .toUpperCase();

      const finalCode = "HFB-" + cleaned;

      updateCode(finalCode, "redeem");
    }

    checkExistingLogin();
  </script>
</body>
</html>
