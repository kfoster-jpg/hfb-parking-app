<!DOCTYPE html>
<html>
<head>
  <title>HFB Staff Code Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="font-family: Arial, sans-serif; padding: 24px; max-width: 900px; margin: auto;">
  <div id="login-screen">
    <h1>Staff Login</h1>

    <input
      id="staff-password"
      type="password"
      placeholder="Enter staff password"
      style="width:100%; padding:12px; font-size:16px; margin:8px 0 12px;"
    />

    <button
      onclick="checkPassword()"
      style="width:100%; padding:12px; background:black; color:white; border:none;"
    >
      Login
    </button>

    <p id="login-error" style="color:red; font-weight:bold;"></p>
  </div>

  <div id="dashboard-screen" style="display:none;">
    <h1>Parking Codes</h1>
    <p id="staff-name-display" style="font-weight:bold;"></p>

    <button onclick="loadCodes()" style="padding:10px 14px; margin-bottom:16px;">
      Refresh Codes
    </button>

    <button onclick="logoutStaff()" style="padding:10px 14px; margin-bottom:16px;">
      Logout
    </button>

    <div id="codes">Loading codes...</div>
  </div>

  <script>
    const STAFF_USERS = {
      "password1": "Kasey Foster",
      "password2": "Sara Jimenez",
      "password3": "Shane Lohr",
      "password4": "George Chavez"
    };

    function checkPassword() {
      const password = document.getElementById("staff-password").value;
      const error = document.getElementById("login-error");

      if (STAFF_USERS[password]) {
        sessionStorage.setItem("hfb_staff_logged_in", "true");
        sessionStorage.setItem("hfb_staff_name", STAFF_USERS[password]);

        showDashboard();
      } else {
        error.innerText = "Incorrect password.";
      }
    }

    function showDashboard() {
      const staffName = sessionStorage.getItem("hfb_staff_name");

      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard-screen").style.display = "block";
      document.getElementById("staff-name-display").innerText =
        "Logged in as: " + staffName;

      loadCodes();
    }

    function checkExistingLogin() {
      if (
        sessionStorage.getItem("hfb_staff_logged_in") === "true" &&
        sessionStorage.getItem("hfb_staff_name")
      ) {
        showDashboard();
      }
    }

    function logoutStaff() {
      sessionStorage.removeItem("hfb_staff_logged_in");
      sessionStorage.removeItem("hfb_staff_name");
      location.reload();
    }

    async function loadCodes() {
      const container = document.getElementById("codes");
      container.innerHTML = "Loading codes...";

      const response = await fetch("/api/list-codes");
      const data = await response.json();

      if (!data.success) {
        container.innerHTML = "Could not load codes.";
        return;
      }

      if (!data.codes.length) {
        container.innerHTML = "No codes found.";
        return;
      }

      container.innerHTML = data.codes.map(item => {
        const issued = item.issued_at ? new Date(item.issued_at).toLocaleString() : "Unknown";
        const redeemedAt = item.redeemed_at ? new Date(item.redeemed_at).toLocaleString() : "";

        return `
          <div style="border:1px solid #ddd; border-radius:10px; padding:16px; margin-bottom:12px;">
            <div style="font-size:24px; font-weight:bold; letter-spacing:1px;">${item.code}</div>

            <div style="margin-top:8px;">
              <strong>Email:</strong> ${item.email || "N/A"}<br>
              <strong>Issued:</strong> ${issued}<br>
              <strong>Status:</strong> ${
                item.redeemed
                  ? "✅ Redeemed" + (redeemedAt ? " at " + redeemedAt : "")
                  : "🟡 Not redeemed"
              }<br>
              <strong>Redeemed By:</strong> ${item.redeemed_by || "N/A"}
            </div>

            ${
              item.redeemed
                ? `<button onclick="updateCode('${item.code}', 'unredeem')" style="margin-top:12px; padding:10px 14px;">
                    Mark Unredeemed
                  </button>`
                : `<button onclick="updateCode('${item.code}', 'redeem')" style="margin-top:12px; padding:10px 14px; background:black; color:white; border:none; border-radius:6px;">
                    Mark Redeemed
                  </button>`
            }
          </div>
        `;
      }).join("");
    }

    async function updateCode(code, action) {
      const managerName = sessionStorage.getItem("hfb_staff_name");

      if (!managerName) {
        alert("Please log in again.");
        logoutStaff();
        return;
      }

      const label = action === "redeem" ? "redeemed" : "unredeemed";

      if (!confirm("Mark " + code + " as " + label + "?")) return;

      const response = await fetch("/api/redeem-code", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          code: code,
          manager_name: managerName,
          action: action
        })
      });

      const data = await response.json();

      alert(data.message || "Updated.");
      loadCodes();
    }

    checkExistingLogin();
  </script>
</body>
</html>
