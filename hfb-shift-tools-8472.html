<!DOCTYPE html>
<html>
<head>
  <title>HFB Staff Code Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="font-family: Arial, sans-serif; padding: 0; max-width: 900px; margin: auto; background:#f6f6f4;">

  <div id="login-screen" style="padding:24px;">
    <h1>Staff Login</h1>

    <input
      id="staff-password"
      type="password"
      placeholder="Enter staff password"
      style="width:100%; padding:12px; font-size:16px; margin:8px 0 12px; box-sizing:border-box;"
    />

    <button onclick="checkPassword()" style="width:100%; padding:12px; background:black; color:white; border:none;">
      Login
    </button>

    <p id="login-error" style="color:red; font-weight:bold;"></p>
  </div>

  <div id="dashboard-screen" style="display:none;">

    <div style="padding:20px 20px 8px;">
      <h1 style="margin-bottom:4px;">Parking Codes</h1>
      <p id="staff-name-display" style="font-weight:bold; margin-top:0;"></p>
    </div>

    <div id="analytics" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin:0 20px 16px;"></div>

    <div
      id="sticky-controls"
      style="
        position:sticky;
        top:0;
        z-index:50;
        background:#f6f6f4;
        padding:12px 20px;
        border-top:1px solid #e5e5e5;
        border-bottom:1px solid #ddd;
        box-shadow:0 2px 8px rgba(0,0,0,.06);
      "
    >
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center;">
        <select onchange="setFilter(this.value)" style="padding:11px 14px; font-size:16px; border-radius:8px; border:1px solid #bbb;">
          <option value="today-all">Today - All</option>
          <option value="today-unredeemed">Today - Unredeemed</option>
          <option value="today-redeemed">Today - Redeemed</option>
          <option value="30min">Last 30 Min</option>
          <option value="60min">Last 60 Min</option>
          <option value="recent">Recent Codes</option>
        </select>

        <button onclick="startScanner()" style="padding:11px 14px; background:black; color:white; border:none; border-radius:8px;">
          Scan QR
        </button>

        <button onclick="manualIssueCode()" style="padding:11px 14px; background:#7c2d12; color:white; border:none; border-radius:8px;">
          Manual Issue
        </button>

        <button onclick="loadCodes()" style="padding:11px 14px; border-radius:8px; border:1px solid #bbb; background:white;">
          Refresh
        </button>

        <button onclick="logoutStaff()" style="padding:11px 14px; border-radius:8px; border:1px solid #bbb; background:white;">
          Logout
        </button>
      </div>

      <input
        id="search-input"
        type="text"
        placeholder="Search by code or email"
        oninput="setSearchTerm(this.value)"
        style="width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:8px;"
      />
    </div>

    <div id="scanner" style="display:none; margin:16px 20px;">
      <div id="qr-reader" style="width:100%; max-width:420px;"></div>

      <button onclick="stopScanner()" style="margin-top:10px; padding:10px 14px;">
        Stop Scanner
      </button>
    </div>

    <div style="padding:0 20px 90px;">
      <p id="filter-label" style="font-weight:bold;"></p>
      <div id="codes">Loading codes...</div>
    </div>

  </div>

  <script>
    let currentFilter = "today-all";
    let searchTerm = "";
    let allCodes = [];
    let html5QrCode = null;
    let scannerRunning = false;
    let recentlyScannedCode = "";
    let compactMode = true;

    function showLoginMessage() {
      const message = sessionStorage.getItem("hfb_login_message");

      if (message) {
        document.getElementById("login-error").innerText = message;
        sessionStorage.removeItem("hfb_login_message");
      }
    }

    function clearStaffSession() {
      sessionStorage.removeItem("hfb_staff_logged_in");
      sessionStorage.removeItem("hfb_staff_name");
      sessionStorage.removeItem("hfb_staff_token");
    }

    function handleSessionExpired() {
      stopScanner();
      clearStaffSession();
      sessionStorage.setItem("hfb_login_message", "Session expired. Please log in again.");
      location.reload();
    }

    async function checkPassword() {
      const password = document.getElementById("staff-password").value;
      const error = document.getElementById("login-error");

      error.innerText = "";

      try {
        const response = await fetch("/api/staff-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          sessionStorage.setItem("hfb_staff_logged_in", "true");
          sessionStorage.setItem("hfb_staff_name", data.staff_name);
          sessionStorage.setItem("hfb_staff_token", data.staff_token);

          showDashboard();
        } else {
          error.innerText = data.message || "Incorrect password.";
        }

      } catch (err) {
        error.innerText = "Login failed. Please try again.";
      }
    }

    function showDashboard() {
      const staffName = sessionStorage.getItem("hfb_staff_name");

      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard-screen").style.display = "block";
      document.getElementById("staff-name-display").innerText = "Logged in as: " + staffName;

      loadCodes();
    }

    function checkExistingLogin() {
      if (
        sessionStorage.getItem("hfb_staff_logged_in") === "true" &&
        sessionStorage.getItem("hfb_staff_name") &&
        sessionStorage.getItem("hfb_staff_token")
      ) {
        showDashboard();
      }
    }

    function logoutStaff() {
      stopScanner();
      clearStaffSession();
      location.reload();
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderCodes();
    }

    function setSearchTerm(value) {
      searchTerm = value.trim().toLowerCase();
      renderCodes();
    }

    function toggleCodeDetails(id) {
      const selectedDetails = document.getElementById("details-" + id);
      const selectedArrow = document.getElementById("arrow-" + id);

      if (!selectedDetails) return;

      const isOpening = selectedDetails.style.display === "none";

      document.querySelectorAll("[id^='details-']").forEach(detail => {
        detail.style.display = "none";
      });

      document.querySelectorAll("[id^='arrow-']").forEach(arrow => {
        arrow.innerText = "▼";
      });

      if (isOpening) {
        selectedDetails.style.display = "block";
        if (selectedArrow) selectedArrow.innerText = "▲";
      }
    }

    function isToday(dateString) {
      if (!dateString) return false;

      const codeDate = new Date(dateString);
      const today = new Date();

      return (
        codeDate.getFullYear() === today.getFullYear() &&
        codeDate.getMonth() === today.getMonth() &&
        codeDate.getDate() === today.getDate()
      );
    }

    function isWithinMinutes(dateString, minutes) {
      if (!dateString) return false;

      const now = Date.now();
      const issued = new Date(dateString).getTime();

      return now - issued <= minutes * 60 * 1000;
    }

    function isOlderThanMinutes(dateString, minutes) {
      if (!dateString) return false;

      const now = Date.now();
      const issued = new Date(dateString).getTime();

      return now - issued > minutes * 60 * 1000;
    }

    function updateAnalytics() {
      const analytics = document.getElementById("analytics");

      const todaysCodes = allCodes.filter(item => isToday(item.issued_at));
      const redeemedToday = todaysCodes.filter(item => item.redeemed);
      const unredeemedToday = todaysCodes.filter(item => !item.redeemed);
      const staleUnredeemedToday = todaysCodes.filter(item =>
        !item.redeemed && isOlderThanMinutes(item.issued_at, 60)
      );

      const redemptionRate = todaysCodes.length
        ? Math.round((redeemedToday.length / todaysCodes.length) * 100)
        : 0;

      analytics.innerHTML = `
        <div style="background:white; border:1px solid #ddd; border-radius:12px; padding:14px;">
          <div style="font-size:13px; color:#555;">Issued Today</div>
          <div style="font-size:26px; font-weight:bold;">${todaysCodes.length}</div>
        </div>

        <div style="background:white; border:1px solid #ddd; border-radius:12px; padding:14px;">
          <div style="font-size:13px; color:#555;">Redeemed Today</div>
          <div style="font-size:26px; font-weight:bold;">${redeemedToday.length}</div>
        </div>

        <div style="background:white; border:1px solid #ddd; border-radius:12px; padding:14px;">
          <div style="font-size:13px; color:#555;">Unredeemed Today</div>
          <div style="font-size:26px; font-weight:bold;">${unredeemedToday.length}</div>
        </div>

   

        <div style="background:white; border:1px solid #ddd; border-radius:12px; padding:14px;">
          <div style="font-size:13px; color:#555;">Redemption Rate</div>
          <div style="font-size:26px; font-weight:bold;">${redemptionRate}%</div>
        </div>
      `;
    }

    function getFilteredCodes() {
      let filtered = [];

      if (currentFilter === "recent") {
        filtered = allCodes;
      } else if (currentFilter === "30min") {
        filtered = allCodes.filter(item => isWithinMinutes(item.issued_at, 30));
      } else if (currentFilter === "60min") {
        filtered = allCodes.filter(item => isWithinMinutes(item.issued_at, 60));
      } else {
        const todaysCodes = allCodes.filter(item => isToday(item.issued_at));

        if (currentFilter === "today-unredeemed") {
          filtered = todaysCodes.filter(item => !item.redeemed);
        } else if (currentFilter === "today-redeemed") {
          filtered = todaysCodes.filter(item => item.redeemed);
        } else {
          filtered = todaysCodes;
        }
      }

      if (searchTerm) {
        filtered = filtered.filter(item => {
          const code = (item.code || "").toLowerCase();
          const email = (item.email || "").toLowerCase();

          return code.includes(searchTerm) || email.includes(searchTerm);
        });
      }

      return filtered;
    }

    function updateFilterLabel(filteredCodes) {
      const label = document.getElementById("filter-label");

      const labels = {
        "today-all": "Showing today’s codes",
        "today-unredeemed": "Showing today’s unredeemed codes",
        "today-redeemed": "Showing today’s redeemed codes",
        "recent": "Showing recent codes",
        "30min": "Showing last 30 minutes",
        "60min": "Showing last 60 minutes"
      };

      const searchLabel = searchTerm ? ` matching “${searchTerm}”` : "";

      label.innerText =
        labels[currentFilter] + searchLabel + " — " + filteredCodes.length + " found";
    }

    async function loadCodes() {
      const container = document.getElementById("codes");
      const token = sessionStorage.getItem("hfb_staff_token");

      container.innerHTML = "Loading codes...";

      try {
        const response = await fetch("/api/list-codes", {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (response.status === 401) {
          handleSessionExpired();
          return;
        }

        if (!data.success) {
          container.innerHTML = data.message || "Could not load codes.";
          return;
        }

        allCodes = data.codes || [];

        updateAnalytics();
        renderCodes();

      } catch (err) {
        container.innerHTML = "Could not load codes.";
      }
    }

    function renderCodes() {
      const container = document.getElementById("codes");
      const filteredCodes = getFilteredCodes();

      updateFilterLabel(filteredCodes);

      if (!filteredCodes.length) {
        container.innerHTML = `
          <div style="background:white; border:1px solid #ddd; border-radius:12px; padding:18px;">
            No codes found for this view.
          </div>
        `;
        return;
      }

      container.innerHTML = filteredCodes.map(item => {
        const issued = item.issued_at ? new Date(item.issued_at).toLocaleString() : "Unknown";
        const redeemedAt = item.redeemed_at ? new Date(item.redeemed_at).toLocaleString() : "";
        const isStale = !item.redeemed && isOlderThanMinutes(item.issued_at, 60);
        const uniqueId = item.id || item.code.replace(/[^a-zA-Z0-9]/g, "");
        const isHighlighted = recentlyScannedCode === item.code;

        const leftBorderColor = item.redeemed
          ? "#9ca3af"
          : isStale
            ? "#dc2626"
            : "#f59e0b";

        const cardOpacity = item.redeemed ? ".82" : "1";

        const cardPadding = compactMode ? "12px 14px" : "16px 18px";
        const detailsPadding = compactMode ? "0 14px 14px" : "0 18px 18px";
        const codeFontSize = compactMode ? "22px" : "26px";

        const highlightStyle = isHighlighted
          ? "outline:3px solid #16a34a; box-shadow:0 0 0 5px rgba(22,163,74,.16);"
          : "box-shadow:0 1px 4px rgba(0,0,0,.06);";

        const statusBadge = item.redeemed
          ? `<span style="display:inline-block; background:#d1d5db; color:#374151; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:bold;">REDEEMED</span>`
          : `<span style="display:inline-block; background:#f59e0b; color:#111827; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:bold;">NEEDS REDEMPTION</span>`;

        const staleBadge = isStale
          ? `<span style="display:inline-block; background:#dc2626; color:white; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:bold;">OLDER THAN 60 MIN</span>`
          : "";

        const scannedBadge = isHighlighted
          ? `<span style="display:inline-block; background:#16a34a; color:white; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:bold;">JUST SCANNED</span>`
          : "";

        const manualReason = item.manual_issue_reason
          ? `<br><strong>Manual Issue Reason:</strong> ${item.manual_issue_reason}`
          : "";

        return `
          <div
            id="card-${uniqueId}"
            style="
              background:white;
              border:1px solid #e5e7eb;
              border-left:8px solid ${leftBorderColor};
              border-radius:14px;
              margin-bottom:${compactMode ? "8px" : "12px"};
              overflow:hidden;
              opacity:${cardOpacity};
              ${highlightStyle}
            "
          >

            <div
              onclick="toggleCodeDetails('${uniqueId}')"
              style="
                cursor:pointer;
                padding:${cardPadding};
                display:flex;
                justify-content:space-between;
                gap:12px;
                align-items:center;
                flex-wrap:wrap;
              "
            >
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span id="arrow-${uniqueId}" style="font-size:16px; font-weight:bold;">▼</span>

                <span style="font-size:${codeFontSize}; font-weight:bold; letter-spacing:1.5px;">
                  ${item.code}
                </span>
              </div>

              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                ${scannedBadge}
                ${statusBadge}
                ${staleBadge}
              </div>
            </div>

            <div id="details-${uniqueId}" style="display:none; padding:${detailsPadding};">
              <div style="margin-top:4px; line-height:1.6; border-top:1px solid rgba(0,0,0,.12); padding-top:14px;">
                <strong>Email:</strong> ${item.email || "N/A"}<br>
                <strong>Issued:</strong> ${issued}<br>
                <strong>Status:</strong> ${
                  item.redeemed
                    ? "✅ Redeemed" + (redeemedAt ? " at " + redeemedAt : "")
                    : isStale
                      ? "🔴 Not redeemed — older than 60 minutes"
                      : "🟡 Not redeemed"
                }<br>
                <strong>Redeemed By:</strong> ${item.redeemed_by || "N/A"}
                ${manualReason}
              </div>

              ${
                item.redeemed
                  ? `<button onclick="event.stopPropagation(); updateCode('${item.code}', 'unredeem')" style="width:100%; min-height:52px; margin-top:14px; padding:14px 16px; border:1px solid #aaa; background:white; border-radius:8px; font-weight:bold; font-size:16px;">
                      Mark Unredeemed
                    </button>`
                  : `<button onclick="event.stopPropagation(); updateCode('${item.code}', 'redeem')" style="width:100%; min-height:52px; margin-top:14px; padding:14px 16px; background:black; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px;">
                      Mark Redeemed
                    </button>`
              }
            </div>

          </div>
        `;
      }).join("");
    }

    async function updateCode(code, action) {
      const managerName = sessionStorage.getItem("hfb_staff_name");
      const token = sessionStorage.getItem("hfb_staff_token");

      if (!managerName || !token) {
        handleSessionExpired();
        return;
      }

      try {
        const response = await fetch("/api/redeem-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            code: code,
            manager_name: managerName,
            action: action
          })
        });

        const data = await response.json();

        if (response.status === 401) {
          handleSessionExpired();
          return;
        }

        if (!data.success) {
          alert(data.message || "Could not update code.");
          loadCodes();
          return;
        }

        if (navigator.vibrate) {
          navigator.vibrate(80);
        }

        loadCodes();

      } catch (err) {
        alert("Could not update code.");
      }
    }

    async function manualIssueCode() {
      const token = sessionStorage.getItem("hfb_staff_token");

      if (!token) {
        handleSessionExpired();
        return;
      }

      const email = prompt("Enter the guest's email for this manual code:");

      if (!email || !email.trim()) {
        return;
      }

      const reasonChoice = prompt(
        "Reason for manual issue:\n\n" +
        "1 = Location issue\n" +
        "2 = Guest phone problem\n" +
        "3 = Manager approved\n" +
        "4 = Other\n\n" +
        "Enter 1, 2, 3, or 4:"
      );

      let reason = "";

      if (reasonChoice === "1") {
        reason = "Location issue";
      } else if (reasonChoice === "2") {
        reason = "Guest phone problem";
      } else if (reasonChoice === "3") {
        reason = "Manager approved";
      } else if (reasonChoice === "4") {
        const customReason = prompt("Enter reason:");

        if (!customReason || !customReason.trim()) {
          reason = "Other";
        } else {
          reason = "Other: " + customReason.trim();
        }
      } else {
        alert("Manual issue canceled. Please select a valid reason.");
        return;
      }

      const confirmed = confirm(
        "Manually issue a parking code to " +
        email.trim() +
        "?\n\nReason: " +
        reason
      );

      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch("/api/manual-issue-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            email: email.trim(),
            reason: reason
          })
        });

        const data = await response.json();

        if (response.status === 401) {
          handleSessionExpired();
          return;
        }

        if (!data.success) {
          alert(data.message || "Could not manually issue code.");
          return;
        }

        alert("Manual code issued: " + data.code.code);
        loadCodes();

      } catch (err) {
        alert("Could not manually issue code.");
      }
    }

    async function startScanner() {
      const scanner = document.getElementById("scanner");

      scanner.style.display = "block";

      if (scannerRunning) return;

      html5QrCode = new Html5Qrcode("qr-reader");

      try {
        scannerRunning = true;

        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          async function(decodedText) {
            await stopScanner();
            handleScannedCode(decodedText);
          },
          function(errorMessage) {
            // Ignore normal misses
          }
        );

      } catch (err) {
        scannerRunning = false;
        alert("Camera access failed or QR scanner could not start.");
      }
    }

    async function stopScanner() {
      if (html5QrCode && scannerRunning) {
        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
        } catch (err) {}
      }

      html5QrCode = null;
      scannerRunning = false;

      const scanner = document.getElementById("scanner");

      if (scanner) {
        scanner.style.display = "none";
      }
    }

    function handleScannedCode(code) {
      const cleaned = code.replace("HFB-", "").trim().toUpperCase();
      const finalCode = "HFB-" + cleaned;

      recentlyScannedCode = finalCode;

      updateCode(finalCode, "redeem");

      setTimeout(function() {
        recentlyScannedCode = "";
        renderCodes();
      }, 6000);
    }

    showLoginMessage();
    checkExistingLogin();
  </script>

</body>
</html>
